<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- La clave 'genil-theme' debe coincidir con CONFIG.THEME_KEY (js/config.js) -->
    <script>
        try {
            if (localStorage.getItem('genil-theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        } catch (e) { }
    </script>
    <title>Monitor Río Genil - Écija</title>
    <meta name="description" content="Monitor en tiempo real del nivel y caudal del Río Genil a su paso por Écija">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Río Genil">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" href="./css/components.css">
    <script src="./vendor/chart.umd.min.js"></script>
</head>

<body>
    <div class="container" id="app"></div>
    <script data-goatcounter="https://jfernanro.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
